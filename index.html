.sp-root{
  --bg:#0B0B0A; --panel:#161513; --elev:#201E1B; --ink:#F1EEE6; --muted:#85827A;
  --line:#2C2A26; --line-soft:#1E1C19; --accent:#F1EEE6; --hot:#FF5A2A; --ochre:#C49A4A;
  --sun:#CE3F3F; --sat:#8C6FE6; --motto:var(--hot); --rowhover:var(--elev); --today:var(--ink);
  --font-sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;
  font-family:var(--font-sans); color:var(--ink); background:var(--bg); color-scheme:dark;
  height:100vh; min-height:600px; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
}
.sp-root[data-theme="light"]{
  --bg:#F5F6F7; --panel:#FFFFFF; --elev:#ECEEF0; --ink:#1A1A1C; --muted:#888A8E;
  --line:#E2E4E7; --line-soft:#EDEEF0; --accent:#1A1A1C; --hot:#E8430A; color-scheme:light;
}
.sp-root *{ box-sizing:border-box; }
.sp-root.ev-mode .sp-cell{ cursor:crosshair; }
.sp-loading{ display:grid; place-items:center; height:400px; color:var(--muted); font-family:var(--font-mono); }

.sp-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sp-brand{ display:flex; align-items:center; gap:10px; position:relative; }
.sp-applogo{ border:none; background:none; padding:0; cursor:pointer; display:grid; place-items:center; width:22px; height:22px; }
.sp-dot{ width:11px; height:11px; background:var(--hot); }
.sp-applogo-emoji{ font-size:18px; line-height:1; }
.sp-applogo:hover{ opacity:.8; }
.sp-app-scrim{ position:fixed; inset:0; z-index:30; }
.sp-applogo-pop{ position:absolute; top:30px; left:0; z-index:31; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; grid-template-columns:repeat(8,1fr); gap:4px; box-shadow:0 12px 30px rgba(0,0,0,.4); width:280px; }
.sp-head h1{ font-size:15px; font-weight:800; margin:0; letter-spacing:-.01em; cursor:text; }
.sp-head h1:hover{ opacity:.7; }
.sp-app-title-edit{ font-size:15px; font-weight:800; border:none; border-bottom:2px solid var(--hot); background:none; color:var(--ink); font-family:var(--font-sans); padding:0 0 2px; min-width:160px; }
.sp-app-title-edit:focus{ outline:none; }
.sp-title-color{ width:20px; height:20px; border-radius:5px; border:1px solid var(--line); cursor:pointer; position:relative; overflow:hidden; flex:none; display:grid; place-items:center; font-size:11px; font-weight:800; }
.sp-title-color input{ position:absolute; inset:0; opacity:0; cursor:pointer; border:none; padding:0; }
.sp-head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sp-search{ position:relative; }
.sp-search-in{ width:150px; border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 11px; font-size:12.5px; color:var(--ink); font-family:var(--font-sans); }
.sp-search-in:focus{ outline:none; border-color:var(--muted); width:200px; }
.sp-search-in::placeholder{ color:var(--muted); }
.sp-search-pop{ position:absolute; top:calc(100% + 6px); right:0; width:300px; max-height:340px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.3); z-index:50; padding:5px; }
.sp-search-empty{ padding:14px; text-align:center; color:var(--muted); font-size:12.5px; }
.sp-search-item{ display:flex; align-items:center; gap:8px; width:100%; border:none; background:none; cursor:pointer; padding:8px 9px; border-radius:7px; text-align:left; }
.sp-search-item:hover{ background:var(--elev); }
.sp-search-dot{ width:8px; height:8px; border-radius:2px; flex:none; }
.sp-search-title{ flex:1; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-search-meta{ font-family:var(--font-mono); font-size:10px; color:var(--muted); flex:none; }
.sp-alert{ display:flex; align-items:center; gap:7px; border:1px solid var(--hot); color:var(--hot); background:rgba(255,90,42,.1); border-radius:7px; padding:6px 11px; font-size:12.5px; cursor:pointer; font-weight:600; }
.sp-alert-dot{ width:7px; height:7px; border-radius:50%; background:var(--hot); animation:sp-pulse 1.6s ease-in-out infinite; }
@keyframes sp-pulse{ 50%{ opacity:.3; } }
.sp-viewtabs{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.sp-viewtabs button{ border:none; background:var(--panel); padding:6px 13px; font-size:12.5px; cursor:pointer; color:var(--muted); border-right:1px solid var(--line); }
.sp-viewtabs button:last-child{ border-right:none; }
.sp-viewtabs button.on{ background:var(--accent); color:var(--bg); font-weight:700; }
.sp-toggle{ border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--muted); }
.sp-theme-wrap{ position:relative; }
.sp-pop-scrim{ position:fixed; inset:0; z-index:60; }
.sp-theme-pop{ position:absolute; top:calc(100% + 6px); right:0; width:220px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.3); z-index:61; padding:5px; }
.sp-theme-opt{ display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer; padding:8px 9px; border-radius:7px; text-align:left; }
.sp-theme-opt:hover{ background:var(--elev); }
.sp-theme-rand{ width:100%; text-align:center; font-size:24px; }
.sp-theme-sw{ display:flex; gap:3px; width:78px; flex:none; }
.sp-theme-sw i{ width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.08) inset; }
.sp-theme-name{ font-size:13px; color:var(--ink); font-weight:600; }
.sp-fontsize{ display:flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:8px; padding:2px; }
.sp-fontsize button{ border:none; background:transparent; color:var(--ink); font-size:12.5px; font-weight:700; padding:4px 8px; cursor:pointer; border-radius:6px; }
.sp-fontsize button:hover{ background:var(--elev); }
.sp-fs-reset{ font-family:var(--font-mono); font-size:11px !important; color:var(--muted) !important; min-width:40px; }
.sp-theme-custom{ border-top:1px solid var(--line); margin-top:5px; padding:10px 9px 5px; }
.sp-theme-custom-h{ font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:700; }
.sp-theme-custom-row{ display:flex; align-items:center; gap:7px; }
.sp-theme-pick{ width:30px; height:30px; border-radius:7px; border:1px solid var(--line); cursor:pointer; position:relative; overflow:hidden; flex:none; }
.sp-theme-pick input{ position:absolute; inset:0; opacity:0; cursor:pointer; border:none; padding:0; }
.sp-theme-apply{ margin-left:auto; border:none; background:var(--hot); color:#fff; border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
.sp-theme-apply:hover{ opacity:.9; }
.sp-toggle.on{ color:var(--ink); border-color:var(--muted); }

.sp-body{ flex:1; --sw:248px; --rw:250px; display:grid; grid-template-columns:var(--sw) 1fr var(--rw); grid-template-rows:minmax(0,1fr); min-height:0; position:relative; }
.sp-body.hide-side{ grid-template-columns:1fr var(--rw); }
.sp-body.hide-right{ grid-template-columns:var(--sw) 1fr; }
.sp-body.hide-side.hide-right{ grid-template-columns:1fr; }
.sp-edge{ position:absolute; top:50%; transform:translateY(-50%); z-index:15; width:22px; height:54px; border:1px solid var(--hot); background:var(--panel); cursor:pointer; color:var(--hot); font-size:18px; font-weight:800; display:grid; place-items:center; padding:0; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.sp-edge:hover{ background:var(--hot); color:#fff; }
.sp-edge-l{ left:0; }
.sp-edge-r{ right:0; }
.sp-body:not(.hide-side) .sp-edge-l{ left:calc(var(--sw) - 11px); }
.sp-body:not(.hide-right) .sp-edge-r{ right:calc(var(--rw) - 11px); }
.sp-resize-r{ position:absolute; top:0; bottom:0; right:var(--rw); width:8px; margin-right:-4px; cursor:col-resize; z-index:13; }
.sp-resize-r:hover{ background:linear-gradient(to right, transparent, var(--rowhover), transparent); }
.sp-resize-l{ position:absolute; top:0; bottom:0; left:var(--sw); width:8px; margin-left:-4px; cursor:col-resize; z-index:13; }
.sp-resize-l:hover{ background:linear-gradient(to right, transparent, var(--rowhover), transparent); }

/* sidebar */
.sp-side{ border-right:1px solid var(--line); padding:16px 18px; display:flex; flex-direction:column; gap:11px; overflow-y:auto; background:var(--panel); }
.sp-side-head{ display:flex; align-items:center; gap:4px; }
.sp-eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.sp-eyebrow-btn{ flex:1; cursor:pointer; padding:3px 0; font-size:14px; letter-spacing:.03em; font-weight:700; }
.sp-eyebrow-btn:hover{ color:var(--ink); }
.sp-side-head.on .sp-eyebrow-btn{ color:var(--ink); }
.sp-icon{ border:1px solid var(--line); background:var(--elev); width:24px; height:24px; border-radius:6px; cursor:pointer; color:var(--ink); font-size:14px; line-height:1; display:grid; place-items:center; }
.sp-icon:hover{ border-color:var(--muted); }
.sp-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
.sp-row{ display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px; min-height:33px; }
.sp-draggable{ cursor:grab; }
.sp-draggable:active{ cursor:grabbing; }
.sp-row:hover{ background:var(--rowhover); }
.sp-row.on{ background:var(--elev); }
.sp-row-team{ font-weight:700; }
.sp-caret{ border:none; background:none; color:var(--muted); cursor:pointer; width:24px; height:24px; padding:0; flex:none; display:grid; place-items:center; transition:transform .15s ease; transform-origin:center; }
.sp-caret.open{ transform:rotate(90deg); }
.sp-caret:hover{ color:var(--ink); }
.sp-row-sub{ padding-left:22px; font-size:12.5px; }
.sp-row-sub2{ padding-left:40px; font-size:12px; }
.sp-row-spacer2{ width:30px; flex:none; }
.sp-subdash{ width:8px; height:2px; border-radius:1px; flex:none; opacity:.7; margin-left:2px; }
.sp-addrow-txt{ color:var(--muted); font-size:12px; }
.sp-addrow:hover .sp-addrow-txt{ color:var(--ink); }
.sp-row-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-pill{ display:inline-block; border-radius:13px; padding:3px 11px; font-size:13px; font-weight:600; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.5; background:color-mix(in srgb, var(--c) 15%, transparent); color:var(--c); }
[data-theme="light"] .sp-pill:not(.sp-pill-all){ color:color-mix(in srgb, var(--c) 62%, #000); }
[data-theme="dark"] .sp-pill:not(.sp-pill-all){ color:color-mix(in srgb, var(--c) 86%, #fff); }
.sp-row-team .sp-pill{ font-weight:700; }
.sp-pill-all{ background:transparent; color:var(--muted); font-weight:600; padding-left:4px; }
.sp-row-spacer{ width:12px; flex:none; }
.sp-row-x,.sp-row-add{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px; opacity:0; line-height:1; padding:0 2px; flex:none; margin-left:auto; }
.sp-row-add{ font-size:13px; }
.sp-row:hover .sp-row-x,.sp-row:hover .sp-row-add{ opacity:.65; }
.sp-row-x:hover{ color:var(--hot); opacity:1; }
.sp-row-add:hover{ color:var(--ink); opacity:1; }
.sp-row-edit{ flex:1; border:1px solid var(--ink); background:var(--bg); border-radius:6px; padding:5px 8px; font-size:13px; font-family:var(--font-sans); color:var(--ink); min-width:0; }
.sp-row-edit:focus{ outline:none; }
.sp-row-confirm{ background:rgba(255,90,42,.1); cursor:default; }
.sp-confirm-q{ flex:1; font-size:12.5px; color:var(--hot); }
.sp-mini{ border:1px solid var(--line); background:var(--elev); border-radius:6px; padding:4px 9px; font-size:11.5px; cursor:pointer; color:var(--muted); }
.sp-mini-go{ border-color:var(--hot); color:var(--hot); }
.sp-mini-go:hover{ background:var(--hot); color:#fff; }
.sp-row-pick{ cursor:default; gap:7px; align-items:flex-start; padding-top:8px; padding-bottom:8px; }
.sp-picks{ display:flex; gap:5px; flex:1; align-items:center; flex-wrap:wrap; }
.sp-member-pick{ display:flex; flex-direction:column; gap:7px; flex:1; }
.sp-label-in{ border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:5px 8px; font-size:12px; font-family:var(--font-sans); color:var(--ink); width:100%; }
.sp-label-in:focus{ outline:none; border-color:var(--ink); }
.sp-color-opt{ width:18px; height:18px; border-radius:4px; border:1px solid rgba(128,128,128,.3); cursor:pointer; padding:0; }
.sp-color-opt:hover{ transform:scale(1.12); }
.sp-color-custom{ width:18px; height:18px; border-radius:4px; cursor:pointer; position:relative; overflow:hidden; border:1px dashed var(--muted); display:grid; place-items:center; }
.sp-color-custom::after{ content:"+"; font-size:13px; color:var(--muted); line-height:1; }
.sp-color-custom input{ position:absolute; inset:-6px; width:160%; height:160%; border:none; padding:0; cursor:pointer; opacity:0; }
.sp-emoji-opt{ width:22px; height:22px; border:1px solid var(--line); background:var(--bg); border-radius:5px; cursor:pointer; font-size:13px; padding:0; display:grid; place-items:center; line-height:1; }
.sp-emoji-opt:hover{ border-color:var(--muted); }
.sp-emoji-clear{ font-size:11px; color:var(--muted); }
.sp-swatch{ width:12px; height:12px; border-radius:2px; flex:none; cursor:pointer; }
.sp-subdot{ width:7px; height:7px; border-radius:50%; flex:none; opacity:.75; margin-left:2px; }
.sp-teamdot{ width:9px; height:9px; border-radius:2px; flex:none; background:var(--muted); opacity:.55; }
.sp-swatch-all{ background:linear-gradient(135deg,#FF4802 0 33%,#FF6CF1 33% 66%,#009953 66% 100%); }
.sp-badge{ min-width:20px; height:20px; border-radius:10px; padding:0 6px; flex:none; font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; line-height:1; white-space:nowrap; }
.sp-badge-all{ background:var(--line); color:var(--muted); }
.sp-badge-sm{ min-width:16px; height:16px; border-radius:8px; padding:0 5px; font-size:9.5px; }
.sp-add{ display:flex; flex-direction:column; gap:6px; padding-top:4px; }
.sp-add-row{ display:flex; gap:6px; }
.sp-add-row .sp-select{ flex:1; min-width:0; }
.sp-input,.sp-select{ width:100%; border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:8px 10px; font-size:13px; font-family:var(--font-sans); color:var(--ink); }
.sp-input:focus,.sp-select:focus{ outline:none; border-color:var(--ink); }
.sp-select{ cursor:pointer; }
.sp-backlog{ flex:1; border:1px dashed var(--line); border-radius:10px; padding:11px; display:flex; flex-direction:column; gap:5px; overflow-y:auto; min-height:110px; transition:.12s; }
.sp-backlog.drop{ border-color:var(--ink); background:var(--elev); }
.sp-empty{ font-size:12px; color:var(--muted); line-height:1.55; margin:6px 2px; }

/* \uC6B0\uCE21 \uD328\uB110 (\uBA54\uBAA8\xB7\uCCB4\uD06C\uB9AC\uC2A4\uD2B8) */
.sp-right{ border-left:1px solid var(--line); padding:16px 18px; display:flex; flex-direction:column; background:var(--panel); overflow:hidden; min-height:0; }
.sp-quick{ display:flex; flex-direction:column; gap:6px; flex:1; min-height:0; }
.sp-memo-label{ font-size:24px; line-height:1; }
.sp-lock{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.sp-lock-handle{ display:flex; align-items:center; justify-content:center; height:16px; margin:8px 0 10px; border-top:1px solid var(--line); cursor:row-resize; color:var(--muted); position:relative; }
.sp-lock-handle span{ position:absolute; top:-9px; background:var(--panel); padding:0 8px; font-size:13px; line-height:1; }
.sp-lock-handle:hover{ color:var(--hot); }
.sp-lock-icon{ font-size:24px; line-height:1; margin:8px 0 12px; }
.sp-lock-reset-bottom{ border:none; background:none; color:var(--muted); font-size:10.5px; cursor:pointer; opacity:.5; padding:6px 0 0; align-self:center; }
.sp-lock-reset-bottom:hover{ opacity:1; color:var(--ink); text-decoration:underline; }
.sp-lock-desc{ font-size:11.5px; color:var(--muted); margin:0; }
.sp-lock-row{ display:flex; gap:6px; }
.sp-lock-pin{ flex:1; letter-spacing:.3em; text-align:center; font-family:var(--font-mono); }
.sp-lock-btn{ border:none; background:var(--hot); color:#fff; border-radius:7px; padding:0 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
.sp-lock-btn:hover{ opacity:.9; }
.sp-lock-msg{ font-size:11px; color:var(--hot); }
.sp-lock-reset{ border:none; background:none; color:var(--muted); font-size:11px; cursor:pointer; text-decoration:underline; align-self:flex-start; padding:2px 0; }
.sp-lock-reset:hover{ color:var(--ink); }
.sp-lock-area{ width:100%; resize:none; min-height:60px; }
.sp-lock-actions{ display:flex; gap:8px; align-items:center; }
.sp-qlist{ display:flex; flex-direction:column; gap:1px; flex:1; overflow-y:auto; min-height:90px; }
.sp-qitem{ display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; font-size:12.5px; cursor:grab; }
.sp-qitem:active{ cursor:grabbing; }
.sp-qitem:hover{ background:var(--rowhover); }
.sp-qitem.pinned{ background:var(--elev); }
.sp-qitem.done .sp-qtext{ text-decoration:line-through; color:var(--muted); }
.sp-qcheck{ width:15px; height:15px; flex:none; border:1.5px solid var(--muted); border-radius:4px; background:transparent; cursor:pointer; color:var(--ink); font-size:10px; line-height:1; display:grid; place-items:center; padding:0; font-weight:700; }
.sp-qitem.done .sp-qcheck{ background:var(--today); color:#fff; border-color:var(--today); }
.sp-qtext{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-qpin{ border:none; background:none; cursor:pointer; font-size:11px; opacity:0; line-height:1; padding:0 1px; flex:none; filter:grayscale(1); }
.sp-qitem:hover .sp-qpin{ opacity:.45; }
.sp-qpin.on{ opacity:1; filter:none; }
.sp-qpin:hover{ opacity:.9; }
.sp-qx{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px; opacity:0; line-height:1; padding:0 1px; flex:none; }
.sp-qitem:hover .sp-qx{ opacity:.65; }
.sp-qx:hover{ color:var(--hot); opacity:1; }

/* chip */
.sp-chip{ display:flex; align-items:center; gap:7px; background:var(--elev); border-left:3px solid var(--cc); border-radius:4px; padding:6px 9px; font-size:calc(12.5px * var(--fs,1)); cursor:grab; line-height:1.3; }
.sp-chip:hover{ filter:brightness(1.08); }
.sp-chip:active{ cursor:grabbing; }
.sp-chip.compact{ padding:3px 7px 3px 8px; font-size:calc(11px * var(--fs,1)); gap:5px; }
.sp-chip.done{ opacity:.42; }
.sp-chip.done .sp-chip-title{ text-decoration:line-through; }
.sp-chip-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:var(--mc); }
.sp-check{ width:15px; height:15px; flex:none; border:1.5px solid var(--mc); border-radius:3px; background:transparent; cursor:pointer; font-size:10px; line-height:1; color:var(--mc); display:grid; place-items:center; padding:0; font-weight:700; }
.sp-chip.compact .sp-check{ width:13px; height:13px; }
.sp-chip.done .sp-check{ background:var(--mc); color:var(--bg); }
.sp-flag{ width:6px; height:6px; border-radius:50%; flex:none; }
.sp-pri-dot{ width:6px; height:6px; border-radius:50%; flex:none; }
.sp-pri-dot.high{ background:#E5564E; }
.sp-pri-dot.mid{ background:#E0B33C; }
.sp-pri-dot.low{ background:var(--muted); opacity:.45; }
.sp-flag.overdue{ background:var(--hot); }
.sp-flag.soon{ background:var(--ochre); }
.sp-range{ color:var(--mc); font-size:11px; flex:none; }
.sp-time{ font-size:10.5px; color:var(--muted); flex:none; }
.sp-chip.compact .sp-time{ font-size:9.5px; }
.sp-chip-x{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 1px; opacity:0; flex:none; }
.sp-chip:hover .sp-chip-x{ opacity:.65; }
.sp-chip-x:hover{ color:var(--hot); opacity:1; }

/* calendar */
.sp-main{ padding:16px 22px; display:flex; flex-direction:column; min-height:0; overflow-y:auto; position:relative; }
.sp-cal-sticky{ position:sticky; top:0; z-index:3; background:var(--bg); padding-bottom:6px; }
.sp-cal-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-top:2px; }
.sp-wx{ display:flex; align-items:stretch; gap:10px; margin:2px 0 6px 8px; flex-wrap:wrap; }
.sp-wx-chip{ display:inline-flex; align-items:center; gap:8px; background:color-mix(in srgb, var(--hot) 8%, var(--panel)); border:1px solid color-mix(in srgb, var(--hot) 22%, var(--line)); border-radius:12px; padding:6px 11px 6px 10px; }
.sp-wx-ic{ font-size:20px; line-height:1; }
.sp-wx-txt{ display:flex; flex-direction:column; line-height:1.2; }
.sp-wx-big{ font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.01em; white-space:nowrap; }
.sp-wx-small{ font-size:10px; color:var(--muted); margin-top:1px; white-space:nowrap; }
.sp-wx-week{ display:flex; align-items:stretch; gap:2px; background:color-mix(in srgb, var(--hot) 8%, var(--panel)); border:1px solid color-mix(in srgb, var(--hot) 22%, var(--line)); border-radius:12px; padding:6px 8px; }
.sp-wx-day{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:2px 5px; min-width:36px; }
.sp-wx-day + .sp-wx-day{ border-left:1px solid color-mix(in srgb, var(--hot) 12%, var(--line)); }
.sp-wx-day-wd{ font-size:11px; font-weight:700; color:var(--muted); }
.sp-wx-day.sun .sp-wx-day-wd{ color:var(--sun); }
.sp-wx-day.sat .sp-wx-day-wd{ color:var(--sat); }
.sp-wx-day-ic{ font-size:15px; line-height:1; }
.sp-wx-day-t{ font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; }
.sp-wx-day-t i{ font-style:normal; color:var(--muted); font-weight:500; margin-left:2px; }
.sp-fb{ margin:0; border:1px solid color-mix(in srgb, var(--hot) 22%, var(--line)); border-radius:12px; background:color-mix(in srgb, var(--hot) 8%, var(--panel)); overflow:hidden; flex:1; min-width:300px; max-width:560px; display:flex; flex-direction:column; }
.sp-fb-head{ display:flex; align-items:center; gap:8px; padding:5px 13px; border-bottom:1px solid color-mix(in srgb, var(--hot) 18%, var(--line)); }
.sp-fb-title{ font-size:15px; }
.sp-fb-sub{ font-size:10.5px; color:var(--muted); margin-left:auto; }
.sp-fb-scroll{ flex:1; max-height:60px; overflow-y:auto; }
.sp-fb-row{ display:grid; grid-template-columns:38px 92px 46px minmax(40px,1fr) 26px 42px 16px; align-items:center; gap:5px; padding:5px 10px; border-bottom:1px solid color-mix(in srgb, var(--hot) 12%, var(--line)); font-size:11.5px; }
.sp-fb-plane{ font-size:13px; text-align:center; }
.sp-fb-row:last-child{ border-bottom:none; }
.sp-fb-row.shared{ opacity:.42; }
.sp-fb-time{ font-family:var(--font-mono); font-weight:700; color:var(--ink); }
.sp-fb-airline{ color:var(--ink); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-fb-flight{ font-family:var(--font-mono); color:var(--muted); font-size:11px; }
.sp-fb-dest{ color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-fb-gate{ font-family:var(--font-mono); font-size:11px; color:var(--muted); text-align:center; }
.sp-fb-status{ font-size:11px; color:var(--muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-fb-status.delay{ color:#E5564E; font-weight:700; }
.sp-fb-status.go{ color:#4FA86E; font-weight:700; }
.sp-fb-empty{ padding:14px; text-align:center; color:var(--muted); font-size:12px; }
.sp-caltitle{ font-family:var(--font-sans); font-size:21px; font-weight:800; margin:0; letter-spacing:-.02em; }
.sp-head-spacer{ flex:1; }
.sp-mono{ font-family:var(--font-mono); }
.sp-nav{ width:30px; height:30px; border:1px solid var(--line); background:var(--panel); border-radius:7px; cursor:pointer; font-size:17px; color:var(--ink); line-height:1; }
.sp-nav:hover{ border-color:var(--muted); }
.sp-today{ margin-left:auto; border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 13px; font-size:12.5px; cursor:pointer; color:var(--ink); }
.sp-motto{ flex:1; min-width:120px; margin:0 6px; border:0.75px solid var(--line); background:color-mix(in srgb, var(--motto) 6%, transparent); border-radius:24px; padding:8px 18px; font-size:calc(13.5px * var(--fs,1)); font-style:italic; font-family:var(--font-sans); color:var(--ink); }
.sp-motto:focus{ outline:none; background:color-mix(in srgb, var(--motto) 14%, transparent); }
.sp-motto::placeholder{ color:var(--muted); font-weight:400; font-style:italic; }
.sp-motto-b{ border:1px solid var(--line); background:var(--panel); border-radius:7px; width:30px; height:32px; cursor:pointer; color:var(--muted); font-weight:800; font-size:13px; flex:none; }
.sp-motto-b.on{ color:var(--ink); border-color:var(--ink); }
.sp-motto-color{ width:30px; height:32px; border:1px solid var(--line); border-radius:7px; cursor:pointer; position:relative; flex:none; display:grid; place-items:center; font-weight:800; font-size:13px; overflow:hidden; }
.sp-motto-color input{ position:absolute; inset:0; opacity:0; cursor:pointer; border:none; padding:0; }

.sp-quarter{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; overflow-y:auto; align-content:start; }
.sp-mini{ display:flex; flex-direction:column; gap:4px; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel); }
.sp-mini-title{ font-size:15px; font-weight:800; letter-spacing:-.01em; margin-bottom:2px; }
.sp-mini-wd{ display:grid; grid-template-columns:repeat(7,1fr); font-family:var(--font-mono); font-size:9px; color:var(--muted); text-align:center; font-weight:700; }
.sp-mini-wd .sun{ color:var(--sun); } .sp-mini-wd .sat{ color:var(--sat); }
.sp-mini-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.sp-mini-cell{ aspect-ratio:1; border:none; background:var(--bg); border-radius:5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; padding:3px 0 0; min-height:32px; }
.sp-mini-cell:hover{ background:var(--elev); }
.sp-mini-cell.out{ opacity:.32; }
.sp-mini-cell.today{ box-shadow:inset 0 0 0 1.5px var(--ink); }
.sp-mini-num{ font-size:10px; color:var(--ink); font-family:var(--font-mono); }
.sp-mini-ev{ width:78%; height:3px; border-radius:2px; margin-top:1px; }
.sp-mini-dots{ display:flex; gap:1.5px; margin-top:2px; flex-wrap:wrap; justify-content:center; }
.sp-mini-dots i{ width:4px; height:4px; border-radius:50%; }
.sp-today:hover{ border-color:var(--muted); }
.sp-evbtn{ border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; color:var(--muted); }
.sp-evbtn.on{ background:var(--hot); color:#fff; border-color:var(--hot); font-weight:600; }

.sp-scroll-cal{ display:flex; flex-direction:column; gap:24px; width:100%; }
.sp-month-block{ scroll-margin-top:6px; }
.sp-month-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.sp-month-label{ font-family:var(--font-sans); font-size:18px; font-weight:800; letter-spacing:-.01em; color:var(--ink); flex:none; }
.sp-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:auto repeat(6,minmax(clamp(94px,9vw,220px),auto)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.sp-wd{ background:var(--panel); text-align:center; padding:5px 0; font-size:11px; font-family:var(--font-mono); color:var(--muted); letter-spacing:.08em; font-weight:800; }
.sp-wd.sun{ color:var(--sun); } .sp-wd.sat{ color:var(--sat); }
.sp-cell{ background:var(--panel); padding:4px 5px; display:flex; flex-direction:column; gap:2px; min-height:74px; overflow:hidden; transition:.1s; position:relative; }
.sp-cell.out{ background:var(--bg); }
.sp-cell.out .sp-daynum{ opacity:.3; }
.sp-cell.today{ box-shadow:inset 0 0 0 2px var(--today); }
.sp-cell.drop{ background:var(--elev); }
.sp-cell.evsel{ background:var(--elev); box-shadow:inset 0 0 0 2px var(--hot); }
.sp-daynum{ font-size:calc(11.5px * var(--fs,1)); color:var(--muted); padding-left:1px; font-weight:600; }
.sp-daynum.holi{ color:var(--sun); }
.sp-holiday{ font-size:calc(10.5px * var(--fs,1)); font-weight:600; color:var(--sun); margin-left:4px; font-family:var(--font-sans); vertical-align:1px; }
.sp-cell.today .sp-daynum{ color:var(--today); font-weight:800; }
.sp-cell-ev{ display:flex; flex-direction:column; gap:2px; }
.sp-evbar{ height:19px; background:var(--ev); display:flex; align-items:center; padding:0 6px; cursor:pointer; overflow:hidden; margin:0 -5px; opacity:.92; }
.sp-evbar.s{ border-top-left-radius:4px; border-bottom-left-radius:4px; margin-left:0; }
.sp-evbar.e{ border-top-right-radius:4px; border-bottom-right-radius:4px; margin-right:0; }
.sp-evbar:hover{ opacity:1; }
.sp-evbar-lbl{ font-size:calc(11.5px * var(--fs,1)); font-weight:700; color:#141210; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-taskbar.done{ opacity:.4; }
.sp-taskbar.done .sp-evbar-lbl{ text-decoration:line-through; }
.sp-cell-list{ display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.sp-anniv-cell{ display:flex; flex-direction:column; gap:2px; margin:1px 0 3px; }
.sp-anniv-pill{ display:inline-flex; align-items:center; gap:3px; background:color-mix(in srgb, #E48AB8 16%, var(--panel)); border:1px solid color-mix(in srgb, #E48AB8 35%, transparent); border-radius:5px; padding:1px 5px; max-width:100%; }
.sp-anniv-pill-ic{ font-size:10px; flex:none; }
.sp-anniv-pill-t{ font-size:calc(10.5px * var(--fs,1)); font-weight:700; color:#C25E94; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
[data-theme="dark"] .sp-anniv-pill-t{ color:#F0A8CC; }
.sp-anniv-form{ display:flex; flex-direction:column; gap:9px; margin-bottom:14px; }
.sp-anniv-icons{ display:flex; gap:4px; flex-wrap:wrap; }
.sp-anniv-ic{ width:32px; height:32px; border:1px solid var(--line); background:var(--elev); border-radius:7px; font-size:15px; cursor:pointer; }
.sp-anniv-ic.on{ border-color:#E48AB8; background:color-mix(in srgb, #E48AB8 18%, var(--panel)); }
.sp-anniv-row{ display:flex; gap:7px; }
.sp-anniv-row .sp-select:nth-child(2){ flex:1; }
.sp-anniv-list{ display:flex; flex-direction:column; gap:5px; max-height:240px; overflow-y:auto; }
.sp-anniv-item{ display:flex; align-items:center; gap:8px; background:var(--elev); border-radius:7px; padding:7px 10px; }
.sp-anniv-item-ic{ font-size:15px; flex:none; }
.sp-anniv-item-label{ flex:1; font-size:13px; font-weight:600; color:var(--ink); }
.sp-anniv-item-date{ font-size:11px; color:var(--muted); }

.sp-week{ flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; min-height:0; }
.sp-wcol{ background:var(--panel); display:flex; flex-direction:column; min-height:0; transition:.1s; }
.sp-wcol.today{ box-shadow:inset 0 0 0 2px var(--ink); }
.sp-wcol.drop{ background:var(--elev); }
.sp-wcol-head{ display:flex; align-items:baseline; justify-content:space-between; padding:8px 10px 6px; border-bottom:1px solid var(--line); }
.sp-wd-lbl{ font-family:var(--font-mono); font-size:11px; color:var(--muted); font-weight:800; }
.sp-wd-lbl.sun{ color:var(--sun); } .sp-wd-lbl.sat{ color:var(--sat); }
.sp-wd-num{ font-size:15px; color:var(--ink); font-weight:800; }
.sp-wcol.today .sp-wd-num{ color:var(--hot); }
.sp-wcol-list{ flex:1; display:flex; flex-direction:column; gap:4px; padding:8px; overflow-y:auto; }
.sp-wcol-list .sp-evbar{ height:18px; margin:0; border-radius:4px; }
.sp-wcol-empty{ color:var(--line); text-align:center; font-size:18px; margin-top:8px; }

/* brief */
.sp-brief{ flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; overflow-y:auto; align-content:start; }
.sp-bcard{ border:1px solid var(--line); border-top:3px solid var(--mc); border-radius:10px; background:var(--panel); padding:16px; display:flex; flex-direction:column; gap:12px; }
.sp-bcard-h{ display:flex; align-items:center; gap:9px; }
.sp-bcard-name{ font-size:calc(15px * var(--fs,1)); font-weight:800; flex:1; color:var(--mc); }
.sp-bcard-count{ font-size:11.5px; color:var(--muted); }
.sp-bsec{ display:flex; flex-direction:column; gap:5px; }
.sp-bsec-h{ font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.sp-bsec-h b{ color:var(--ink); }
.sp-bsec.overdue .sp-bsec-h,.sp-bsec.overdue .sp-bsec-h b{ color:var(--hot); }
.sp-bsec.today .sp-bsec-h b{ color:var(--ink); }
.sp-bsec.muted{ opacity:.65; }
.sp-brow{ display:flex; align-items:center; gap:8px; text-align:left; border:none; border-left:4px solid var(--cc); background:var(--elev); border-radius:5px; padding:8px 11px; cursor:pointer; }
.sp-brow:hover{ background:var(--line); }
.sp-brow-time{ font-size:calc(11px * var(--fs,1)); color:var(--muted); flex:none; }
.sp-bcard-all{ border-top:3px solid var(--hot); grid-column:1/-1; }
