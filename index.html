.sp-np-sws{ display:flex; gap:5px; }
.sp-np-sw{ width:20px; height:20px; border-radius:50%; border:2px solid rgba(0,0,0,.15); cursor:pointer; padding:0; }

.sp-fb-row{ display:grid; grid-template-columns:38px 92px 46px minmax(40px,1fr) 26px 42px 16px; align-items:center; gap:5px; padding:5px 10px; border-bottom:1px solid var(--widget-line); font-size:11.5px; }

.sp-mono{ font-family:var(--font-mono); }
.sp-nav{ width:30px; height:30px; border:1px solid var(--line); background:var(--panel); border-radius:7px; cursor:pointer; font-size:17px; color:var(--ink); line-height:1; }

.sp-quarter{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; overflow-y:auto; align-content:start; }

.sp-today:hover{ border-color:var(--muted); }
.sp-evbtn{ border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; color:var(--muted); }

.sp-scroll-cal{ display:flex; flex-direction:column; gap:24px; width:100%; position:relative; }

.sp-month-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.sp-month-label{ font-family:var(--font-sans); font-size:18px; font-weight:800; letter-spacing:-.01em; color:var(--ink); flex:none; }
.sp-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:auto repeat(6,minmax(clamp(94px,9vw,220px),auto)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.sp-wd{ background:var(--panel); text-align:center; padding:5px 0; font-size:11px; font-family:var(--font-mono); color:var(--muted); letter-spacing:.08em; font-weight:800; }
.sp-wd.sun{ color:var(--sun); } .sp-wd.sat{ color:var(--sat); }
.sp-cell{ background:var(--panel); padding:4px 5px; display:flex; flex-direction:column; justify-content:flex-start; gap:2px; min-height:74px; overflow:hidden; transition:background-color .1s; position:relative; }
.sp-cell:has(.sp-anniv-dot:hover), .sp-cell:has(.sp-anniv-dot:focus){ overflow:visible; z-index:25; }
.sp-cell.out{ background:var(--bg); }
.sp-cell.out .sp-daynum{ opacity:.3; }
.sp-cell.today{ box-shadow:inset 0 0 0 2px var(--today); }
.sp-cell.drop{ background:var(--elev); }
.sp-cell.evsel{ background:var(--elev); box-shadow:inset 0 0 0 2px var(--hot); }
.sp-daynum{ font-size:calc(11.5px * var(--fs,1)); color:var(--muted); padding-left:1px; font-weight:600; display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
.sp-anniv-dot{ position:relative; display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:50%; background:var(--elev); border:0.5px solid #6b6b6b; font-size:13px; line-height:1; cursor:default; outline:none; }
.sp-anniv-tip{ position:absolute; bottom:calc(100% + 5px); left:0; white-space:nowrap; background:rgba(60,58,60,0.95); color:#fff; font-size:11px; font-weight:500; padding:5px 9px; border-radius:7px; opacity:0; visibility:hidden; transition:opacity .12s; z-index:50; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.3); }
.sp-anniv-dot:hover .sp-anniv-tip, .sp-anniv-dot:focus .sp-anniv-tip{ opacity:1; visibility:visible; }

.sp-holiday{ font-size:calc(10.5px * var(--fs,1)); font-weight:600; color:var(--sun); margin-left:4px; font-family:var(--font-sans); vertical-align:1px; }

.sp-cell-ev{ display:flex; flex-direction:column; gap:2px; }

.sp-evbar-lbl{ font-size:calc(10px * var(--fs,1)); font-weight:700; color:var(--ev-ink,#141210); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.sp-cell-list{ display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1; min-height:0; }
.sp-anniv-cell{ display:flex; flex-direction:column; gap:2px; margin:1px 0 3px; }

.sp-anniv-form{ display:flex; flex-direction:column; gap:9px; margin-bottom:14px; }

.sp-week{ flex:1; display:grid; grid-template-columns:repeat(7,minmax(135px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow-x:auto; overflow-y:hidden; min-height:0; }

.sp-up-sort{ border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:6px; padding:4px 9px; font-size:11.5px; cursor:pointer; font-weight:600; }

.sp-brow-title{ font-size:calc(12.5px * var(--fs,1)); color:var(--mc); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

/* detail / event edit */
.sp-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; }
.sp-import{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(480px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.4); z-index:120; padding:20px; }
