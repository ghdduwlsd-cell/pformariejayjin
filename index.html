.sp-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:auto repeat(6,minmax(clamp(94px,9vw,220px),auto)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.sp-wd{ background:var(--panel); text-align:center; padding:5px 0; font-size:11px; font-family:var(--font-mono); color:var(--muted); letter-spacing:.08em; font-weight:800; }

.sp-cell{ background:var(--panel); padding:4px 5px; display:flex; flex-direction:column; justify-content:flex-start; gap:2px; min-height:74px; overflow:hidden; transition:.1s; position:relative; }

.sp-daynum{ font-size:calc(11.5px * var(--fs,1)); color:var(--muted); padding-left:1px; font-weight:600; display:flex; align-items:center; gap:3px; flex-wrap:wrap; }

.sp-cell-list{ display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1; min-height:0; }
